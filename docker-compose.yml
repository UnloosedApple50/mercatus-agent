version: '3.8'

services:
  mercatus:
    build: .
    ports:
      - "8585:8585"
    environment:
      - MERCATUS_HOST=0.0.0.0
      - MERCATUS_PORT=8585
      - MERCATUS_LLM_BASE_URL=http://ollama:11434/v1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
